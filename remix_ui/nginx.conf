worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=public_api_limit:10m rate=5r/s;
    limit_req_status 429;

    map $args $public_request_is_malicious {
        default 0;
        ~*(?:\.\./|%2e%2e(?:%2f|/)|%252e%252e) 1;
        ~*(?:<|%3c)(?:script|/script)(?:>|%3e) 1;
    }

    upstream meayon_erp_backend {
        server web-backend:8000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

        location /public/invoice/ {
            if ($public_request_is_malicious) {
                return 444;
            }

            limit_req zone=public_api_limit burst=10 nodelay;
            proxy_pass http://meayon_erp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://meayon_erp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}