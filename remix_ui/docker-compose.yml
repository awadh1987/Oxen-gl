services:
  web-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oxen_core_api
    environment:
      DATABASE_URL: sqlite:////app/data/oxen_gl.db
      NGINX_ACCESS_LOG: /var/log/nginx/access.log
      APP_GLOBAL_IDENTITY: legacy
    volumes:
      - ./backend_data:/app/data
      - oxen_shared_logs:/var/log/nginx
    expose:
      - "8000"
    restart: always

  proxy-gateway:
    image: nginx:1.25-alpine
    container_name: oxen_nginx_waf
    depends_on:
      - web-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - oxen_shared_logs:/var/log/nginx
    restart: always

  certbot-renew-engine:
    image: certbot/certbot:v2.8.0
    container_name: oxen_certbot_ssl
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  oxen_shared_logs: